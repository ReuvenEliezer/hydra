{{/*
  order-service ClusterIP Service (FR-045).
*/}}
apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: {{ .Values.global.appNamespace }}
  labels:
    {{- include "hydra-lab.labels" . | nindent 4 }}
    {{- include "hydra-lab.selector" (dict "name" "order-service") | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "hydra-lab.selector" (dict "name" "order-service") | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.order.port }}
      targetPort: http
      protocol: TCP
