{{/*
  Service accounts (FR-075).

  One identity per workload, each with NO RoleBinding at all — which is the
  least privilege available. Neither service calls the Kubernetes API, so any
  permission granted here would be a permission nothing uses, and an unused
  permission is the one nobody notices when it later matters.

  automountServiceAccountToken: false on every one of them. The default is to
  mount a projected API token into every container; a workload that never talks
  to the API server does not need a credential for it, and a token that exists
  is a token that can be exfiltrated.
*/}}
{{- range $name := list "auth-service" "order-service" "hydra-migrate" "hydra-fixture" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.appNamespace }}
  labels:
    {{- include "hydra-lab.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
{{- range $name := list "postgres" "redis" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.dataNamespace }}
  labels:
    {{- include "hydra-lab.labels" $ | nindent 4 }}
automountServiceAccountToken: false
---
{{- end }}
