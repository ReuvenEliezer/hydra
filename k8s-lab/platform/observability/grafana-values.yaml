# ---------------------------------------------------------------------------
# Grafana — THE ONLY UI (FR-080a, FR-088).
#
# It queries Prometheus for metrics and Tempo for traces. That is the entire
# reason Tempo was chosen over Jaeger: a trace store without a second console.
# `make console-metrics` opens this and nothing else, and no fourth console may
# be added.
# ---------------------------------------------------------------------------

# Lab credentials. Not a secret and not pretending to be one — an admin password
# in a values file would be a credential in the tracked tree (FR-053), so
# anonymous access with an Admin role is the honest form: nothing to leak.
# docs/production-mapping.md maps this to real SSO.
adminUser: admin
adminPassword: admin

grafana.ini:
  auth.anonymous:
    enabled: true
    org_role: Admin
  auth:
    disable_login_form: false
  security:
    # Grafana is reached through a port-forward from the workstation, so it is
    # served at a path it does not know about. Without this, every asset URL
    # points at the wrong host and the UI loads blank.
    allow_embedding: true
  users:
    default_theme: dark
  # The trace-to-metrics and metrics-to-trace links below need this.
  feature_toggles:
    enable: traceqlEditor

persistence:
  # Dashboards are delivered as a ConfigMap (below), so nothing that matters is
  # stored in Grafana's own database. Making that database ephemeral is a
  # feature: it means a dashboard cannot be edited into existence and then lost
  # with the cluster, which is how dashboards usually die.
  enabled: false

datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        url: http://prometheus-server.hydra-obs
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: 15s
          # Links a metric exemplar straight to the trace that produced it.
          # This is what makes "the p99 spiked at 14:03" answerable with "here
          # is one of the slow requests" rather than a second investigation.
          exemplarTraceIdDestinations:
            - name: trace_id
              datasourceUid: tempo

      - name: Tempo
        type: tempo
        uid: tempo
        url: http://tempo.hydra-obs:3100
        access: proxy
        jsonData:
          # Trace -> logs is deliberately NOT configured: there is no log store
          # (FR-082 rules out Loki), so a link would lead nowhere. Logs are read
          # with `kubectl logs` and carry trace_id, which is the documented
          # correlation path in docs/observability.md.
          tracesToMetrics:
            datasourceUid: prometheus
            tags:
              - {key: service.name, value: service}
          nodeGraph:
            enabled: true
          serviceMap:
            datasourceUid: prometheus

# Dashboards come from a ConfigMap the sidecar watches, applied by platform.sh
# from platform/observability/dashboards/. Versioned with the lab rather than
# clicked into a database that disappears with the cluster.
sidecar:
  dashboards:
    enabled: true
    label: grafana_dashboard
    labelValue: "1"
    searchNamespace: ALL
    folderAnnotation: grafana_folder
    provider:
      allowUiUpdates: true

service:
  type: ClusterIP

resources:
  requests: {cpu: 100m, memory: 128Mi}
  limits:   {memory: 512Mi}
