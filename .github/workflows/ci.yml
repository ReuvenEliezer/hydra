name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4.2.2

      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      #
      # Build the complete Maven reactor.
      # Module order is resolved automatically from inter-module dependencies.
      # verify runs both Surefire (unit tests) and Failsafe (integration tests).
      #
      - name: Build & Run Tests
        run: mvn -B -fae verify

      #
      # Publish JUnit reports in the GitHub Actions UI.
      #
      - name: Publish Test Report
        if: always()
        uses: dorny/test-reporter@v2.1.0
        continue-on-error: true
        with:
          name: Maven Tests
          path: |
            **/target/surefire-reports/*.xml
            **/target/failsafe-reports/*.xml
          reporter: java-junit

      #
      # Upload reports for debugging failed builds.
      #
      - name: Upload Test Reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/**
            **/target/failsafe-reports/**
          retention-days: 7

      - name: Build Information
        run: |
          echo "Run ID: ${{ github.run_id }}"
          echo "Run Number: ${{ github.run_number }}"
          echo "Run Attempt: ${{ github.run_attempt }}"