name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# Least-privilege, not write-all: dorny/test-reporter needs `checks: write` to publish
# a report, and `pull-requests: write` so it can annotate the PR itself. This also covers
# dependabot-opened PRs (.github/dependabot.yml) - those run with a read-only GITHUB_TOKEN
# by default, so the report wouldn't appear at all without explicitly granting this here.
permissions:
  contents: read
  checks: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Create private key file
        run: |
          mkdir -p $GITHUB_WORKSPACE/keys
          printf "%s" "${{ secrets.HYDRA_TEST_PRIVATE_KEY }}" > $GITHUB_WORKSPACE/keys/private-key.pem
          ls -l $GITHUB_WORKSPACE/keys
      - name: Verify key
        run: |
          cat $GITHUB_WORKSPACE/keys/private-key.pem | wc -l
      - name: Set up JDK 25
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Verify Docker is reachable (Testcontainers needs this)
        run: docker info

      # Separate build step from test step (mirrors local `mvn install` + `mvn test`):
      # a compile/packaging failure shows as its own red step, distinct from a test failure,
      # instead of both being buried inside one combined `verify` run.
      - name: Build (compile & package, skip tests)
        run: mvn -B clean install -DskipTests

      # One mvn invocation for the whole reactor - no docker-compose, no service-registry
      # wait. integration-tests starts both real Spring contexts plus a Testcontainers
      # Postgres in-process (random ports, no external orchestration needed), so it's just
      # another reactor module here, not a separately stood-up environment.
      # -fae (fail-at-end): surfaces every failing module in one run, not just the first.
      - name: Run all tests
        env:
          JWT_PRIVATE_KEY_PATH: ${{ github.workspace }}/keys/private-key.pem
        run: mvn -B -fae test
      - name: Debug runtime path
        run: |
          echo "EXPECTED PATH: $GITHUB_WORKSPACE/keys/private-key.pem"
          ls -l $GITHUB_WORKSPACE/keys/private-key.pem || true
          head -n 5 $GITHUB_WORKSPACE/keys/private-key.pem
      - name: Test report - auth-service
        uses: dorny/test-reporter@v2.1.0
        if: success() || failure()
        with:
          name: Tests - auth-service
          path: 'auth-service/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Test report - order-service
        uses: dorny/test-reporter@v2.1.0
        if: success() || failure()
        with:
          name: Tests - order-service
          path: 'order-service/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      - name: Test report - cross-service integration
        uses: dorny/test-reporter@v2.1.0
        if: success() || failure()
        with:
          name: Tests - integration-tests
          path: 'integration-tests/target/surefire-reports/*.xml'
          reporter: java-junit
          fail-on-error: true

      # security-common-starter and infra-database have no tests yet - add a report step
      # for each here the day that changes, same pattern as above.

      - name: Upload raw surefire reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/*.txt'
          retention-days: 7
