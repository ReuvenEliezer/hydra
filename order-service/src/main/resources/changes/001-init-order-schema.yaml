databaseChangeLog:
  - changeSet:
      id: 20260614-01-create-orders-table
      author: reuven
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_orders
              - column:
                  name: tenant_id
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: order_number
                  type: varchar(50)
                  constraints:
                    nullable: false
              - column:
                  name: total_amount
                  type: decimal(19, 2)
                  constraints:
                    nullable: false
              - column:
                  name: status
                  type: varchar(20)
                  constraints:
                    nullable: false
              - column:
                  name: created_by
                  type: uuid
                  constraints:
                    nullable: false
              - column:
                  name: version
                  type: bigint
                  defaultValue: 0
              - column:
                  name: created_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP
              - column:
                  name: updated_at
                  type: timestamp
                  defaultValueComputed: CURRENT_TIMESTAMP

        - addForeignKeyConstraint:
            baseTableName: orders
            baseColumnNames: tenant_id
            referencedTableName: tenants
            referencedColumnNames: id
            constraintName: fk_orders_tenant

        - createIndex:
            indexName: idx_orders_tenant_id
            tableName: orders
            columns:
              - column:
                  name: tenant_id

        - createIndex:
            indexName: idx_orders_tenant_created
            tableName: orders
            columns:
              - column:
                  name: tenant_id
              - column:
                  name: created_at