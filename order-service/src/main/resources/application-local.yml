spring:
  datasource:
    # Overridable so an isolated run (a throwaway file, a scratch DB) can point elsewhere
    # without editing this file. Left hardcoded, DB_URL is silently ignored and the run
    # lands on the shared local database instead - which is how a "sandboxed" test ends up
    # writing to real dev data.
    url: ${DB_URL:jdbc:h2:file:~/data/orders_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true

  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: false
hydra:
  cors:
    allowed-origin-patterns: http://*.localhost:5173,http://*.localhost:6006
  tenant:
    base-domains: localhost