server:
  port: 8082
spring:
  output:
    ansi:
      enabled: always
  application:
    name: order-service
#  mvc:
#    format:
#      date: iso
#      date-time: iso
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${AUTH_SERVICE_URL:http://localhost:8083}/.well-known/jwks.json
          issuer-uri: ${AUTH_SERVICE_ISSUER:hydra-auth-service}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized