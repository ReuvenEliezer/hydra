spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
refresh-token:
  grace-ttl: PT2S
  cookie:
    secure: false
# Integration tests exercise the real matching rule rather than a test-only bypass (FR-008):
# MockMvc sets Host: <identifier>.localhost and resolution runs exactly as it does locally.
hydra:
  tenant:
    base-domains: localhost