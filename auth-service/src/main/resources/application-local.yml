spring:
  datasource:
    url: jdbc:h2:file:~/data/auth_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  h2:
    console:
      enabled: true
      path: /h2-console   #http://localhost:8083/h2-console/login.jsp
      settings:
        web-allow-others: false
        trace: false
jwt:
  private-key-path: ${JWT_PRIVATE_KEY_PATH}
refresh-token:
  cookie:
    secure: false
hydra:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:6006