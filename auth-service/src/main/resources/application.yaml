server:
  port: 8083
spring:
  output:
    ansi:
      enabled: always
  profiles:
    active: local
  application:
    name: auth-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/auth_db}
    driver-class-name: org.postgresql.Driver
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
  threads:
    virtual:
      enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
jwt:
  secret-name: "hydra-aws-secret-name"
  key-id: "auth-service-key-v1"
  issuer: hydra-auth-service
  expiration-duration: PT1H
  cache-max-age-duration: PT15M
# Browser origins allowed to call this API, as PATTERNS - every tenant is its own origin
# (https://acme.hydra.example.com), so a fixed per-origin list would need a deployment step per
# tenant. Patterns are not "*": Spring matches the request's Origin and echoes back that one
# specific origin, which is what keeps allowCredentials(true) - required by the refresh-cookie
# flow - legal. Comma-separated; an empty value still fails closed.
hydra:
  cors:
    allowed-origin-patterns: ${CORS_ALLOWED_ORIGIN_PATTERNS:http://*.localhost:5173}
    max-age: ${CORS_MAX_AGE:PT30M}
  # Tenant resolution from the request's own Host header. base-domains is the allow-list a host
  # must end with for the single label in front of it to name a tenant; empty means no address
  # resolves. reserved-identifiers are the words an operator may not claim at provisioning time.
  tenant:
    base-domains: ${TENANT_BASE_DOMAINS:}
    reserved-identifiers: ${TENANT_RESERVED_IDENTIFIERS:www,api,admin,app,auth,mail,static,cdn,status,support,docs}
refresh-token:
  ttl: ${REFRESH_TOKEN_TTL:P30D}
  grace-ttl: ${REFRESH_TOKEN_GRACE_TTL:PT5S}
  cookie:
    secure: ${REFRESH_COOKIE_SECURE:true}
# See features/rate-limited/REQUIREMENTS.md and DECISIONS.md.
# Every limit below is "capacity requests per window", enforced independently per
# dimension (e.g. login's per-ip and per-username limits do not affect each other).
rate-limit:
  enabled: ${RATE_LIMIT_ENABLED:true}
  # false (default) = fail closed: a Redis outage rejects requests same as a real
  # limit breach. true = fail open: requests pass through unthrottled during an
  # outage. See Bucket4jRateLimiterEngine's Javadoc before flipping this.
  fail-open: ${RATE_LIMIT_FAIL_OPEN:false}
  # Map keyed by the limit() name used on each @RateLimited annotation - adding a new
  # protected endpoint anywhere in auth-service only requires a new entry here plus
  # the annotation, never a new Java type.
  limits:
    login-ip:
      capacity: ${RATE_LIMIT_LOGIN_PER_IP_CAPACITY:5}
      window: ${RATE_LIMIT_LOGIN_PER_IP_WINDOW:PT1M}
    login-username:
      capacity: ${RATE_LIMIT_LOGIN_PER_USERNAME_CAPACITY:5}
      window: ${RATE_LIMIT_LOGIN_PER_USERNAME_WINDOW:PT1M}
    refresh-ip:
      capacity: ${RATE_LIMIT_REFRESH_PER_IP_CAPACITY:20}
      window: ${RATE_LIMIT_REFRESH_PER_IP_WINDOW:PT1M}
    refresh-token:
      capacity: ${RATE_LIMIT_REFRESH_PER_TOKEN_CAPACITY:20}
      window: ${RATE_LIMIT_REFRESH_PER_TOKEN_WINDOW:PT1M}
    # The public tenant lookup is unauthenticated, so its only cost control is this. Capacity
    # sits far above the one call a sign-in page makes per load (reloads and several tenant
    # addresses stay well under it) while making a sweep of the identifier space impractical.
    tenant-resolve-ip:
      capacity: ${RATE_LIMIT_TENANT_RESOLVE_PER_IP_CAPACITY:30}
      window: ${RATE_LIMIT_TENANT_RESOLVE_PER_IP_WINDOW:PT1M}
